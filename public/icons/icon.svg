<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="sky" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#0d1730"/>
      <stop offset="1" stop-color="#060b16"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <g fill="#8fa3c8" opacity=".5">
    <circle cx="70" cy="90" r="2.4"/><circle cx="440" cy="70" r="2"/><circle cx="460" cy="400" r="2.4"/>
    <circle cx="60" cy="430" r="2"/><circle cx="250" cy="40" r="1.8"/><circle cx="410" cy="250" r="1.6"/>
  </g>
  <!-- import routes -->
  <g stroke="#5bd6ff" stroke-width="5" stroke-linecap="round" opacity=".75">
    <line x1="150" y1="170" x2="262" y2="250"/>
    <line x1="262" y1="250" x2="372" y2="160"/>
    <line x1="262" y1="250" x2="220" y2="370"/>
    <line x1="220" y1="370" x2="360" y2="352"/>
    <line x1="372" y1="160" x2="360" y2="352"/>
  </g>
  <!-- the course -->
  <path d="M 92 410 Q 150 300 220 370" fill="none" stroke="#ff4fd8" stroke-width="7" stroke-linecap="round" stroke-dasharray="16 13"/>
  <g filter="url(#glow)">
    <circle cx="150" cy="170" r="24" fill="#a78bfa"/>
    <circle cx="372" cy="160" r="20" fill="#6ee7a8"/>
    <circle cx="262" cy="250" r="36" fill="#eaf6ff"/>
    <circle cx="360" cy="352" r="18" fill="#ffb547"/>
    <circle cx="220" cy="370" r="22" fill="#5bd6ff"/>
  </g>
  <circle cx="220" cy="370" r="40" fill="none" stroke="#ff4fd8" stroke-width="6"/>
</svg>
